name: Rails tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rails-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rails db:prepare
      - run: bundle exec rails test
      - run: bundle exec rails zeitwerk:check
